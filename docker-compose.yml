services:
  db:
    image: postgres:17-alpine
    container_name: yadaki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yadaki
      POSTGRES_PASSWORD: yadaki_dev_pass
      POSTGRES_DB: yadaki
    ports:
      - "5433:5432"
    volumes:
      - yadaki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yadaki -d yadaki"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yadaki_pgdata:
